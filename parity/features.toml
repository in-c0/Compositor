# The features PARITY.md reports on, in the order they are ported.
#
# `key` is the corpus folder whose cases count toward the feature. `paths` are the port sources
# that can only affect this feature: a change there re-runs just its cases, and a change to port
# code no feature claims re-runs everything. `gaps` are known differences, each explained.

[[feature]]
key = "format"
name = ".comp read and write"
paths = ["port/crates/comp-format/**"]

[[feature]]
key = "blend"
name = "Layer compositing and blend modes"
paths = ["port/crates/engine/src/blend/**"]

[[feature]]
key = "masks"
name = "Layer and folder masks"
paths = ["port/crates/engine/src/mask/**"]

[[feature]]
key = "clipping"
name = "Clipping masks"
paths = ["port/crates/engine/src/clip/**"]

[[feature]]
key = "folders"
name = "Folders"
paths = ["port/crates/engine/src/folder/**"]

[[feature]]
key = "transform"
name = "Transforms and distort"
paths = ["port/crates/engine/src/transform/**"]
gaps = [
    "`transform/rotate-45`: two pixels on the exact diagonal of a layer rotated 45 degrees take the other row as their heavy pixel on the Mac (a sample position exactly between two rows, which Core Graphics' own arithmetic puts a hair to one side). They differ by 1/255.",
    "High-quality interpolation shrinking a rotated image, and a layer's own mask on an image High shrinks, are pending: the `cg-*` probes measure Core Graphics' High only for upright draws of images (`transform/high.rs`).",
    "An unlinked mask placed at a rotation (`transform/probe-high-rotate`) is drawn through its rectangle's fills, which the port covers by exact area; 29 edge pixels come out 1 level off (within tolerance). The same fills on rotated masks through Image Size are recorded under `document`. Unlinked masks shrunk at a rotation are pending.",
    "Folder masks resampled over layers that are themselves transformed, and resampled masks on adjustment layers, are pending: Core Graphics resamples a clip mask with the interpolation of whatever is drawn through it, measured so far only for layers drawn 1:1.",
    "An unlinked mask's background (white or black beyond its pixels) is read from the mask's own edge; the Mac reads a 96-pixel thumbnail, which only decides differently when the edge averages within a hair of half gray.",
]

[[feature]]
key = "adjust"
name = "Adjustment layers"
paths = ["port/crates/engine/src/adjust/**"]
gaps = [
    "Gaussian Blur reproduces Core Image exactly, but above σ 1.12 Core Image hands the blur to Metal Performance Shaders, which fits its weights on the CPU. The port carries the weights logged for every σ that is a multiple of 0.05 from 1 to 250 (`port/tools/mps-gaussian`) and returns Unsupported for any other σ.",
    "Motion Blur at 0° and 90° is exact. At other angles Core Image rotates the image into the streak's frame and back, and a few pixels come out one or two levels off because the port can't yet match how the Mac's GPU rounds those sample coordinates: the probes show max 1 (3 of 4,096 pixels) at 45° and 10 px, max 1 (9 pixels) at 30° and 20 px, max 2 (6 pixels) at 45° and 20 px, and max 3 (43 of 16,384 pixels) at 45° and 40 px. The cases over 1/255 are listed in `KNOWN_GAPS` in `adjust/tests.rs`.",
    "Motion Blur returns Unsupported for distances where Core Image blurs a shrunk image with a 3-tap kernel whose sample offset isn't known yet (about 14–16, 32–36, 57–64 and 127–142 px).",
]

[[feature]]
key = "filters"
name = "Filters"
# Filters reuse the adjustment kernels, and Remove Background's mask comes from `ml`.
# Dither's chunky pixels are reduced with Core Graphics' High (`transform/high.rs`).
paths = ["port/crates/engine/src/filters/**", "port/crates/engine/src/adjust/**", "port/crates/engine/src/ml/**", "port/crates/engine/src/transform/high.rs"]
gaps = [
    "Dither's ASCII style draws the system's bold monospaced font with Core Text, which the port doesn't have; its scanline glow is a Core Image blur of a Core Image scale. Both are pending.",
    "A filter inside a selection mixes back through the selection's coverage, which the port rasterizes within 1/255 of the Mac on anti-aliased and feathered edges (see Selections). Where a coverage byte is one level off, the pixel under it can be too: 1 pixel each on `content-fill-ellipse-feather` and `content-fill-translucent`, 1/255. Everything else in Content-Aware Fill (the fill itself, growing the layer, the blend, the selection drawn onto a flipped or rotated layer, or one shown at up to twice its size) matches exactly.",
    "A selection drawn onto a layer shown at more than twice its size is pending. Core Graphics' clip then reaches further than the low-quality sampler that matches at 2× and below: on `content-fill-probe-third` (a layer at 3×) it marks one more layer column on each side, so the fill starts from a different hole and 520 of 4,096 pixels differ, by up to 138/255.",
]

[[feature]]
key = "effects"
name = "Layer effects"
# Effects on transformed layers are drawn through the transform module.
paths = ["port/crates/engine/src/effects/**", "port/crates/engine/src/transform/**"]

[[feature]]
key = "psd"
name = "PSD and PSB import and export"
paths = ["port/crates/engine/src/psd/**", "port/crates/psd/**"]
gaps = [
    "The Mac importer reads a Curves adjustment (`curv`) with a 2-byte curve count where Photoshop stores a 4-byte channel mask, so Curves layers from real Photoshop files import as identity curves. The port reads them the same way, to match.",
    "The Mac importer drops Dissolve, Darker Color and Lighter Color (they become Normal), makes every folder pass-through, folds fill opacity into opacity, and skips unsupported adjustment layers. The port does the same.",
    "Type layers the Mac keeps editable (drawn by Core Text) and fill layers it turns into live shapes or draws from their vector masks (Core Graphics antialiasing) import as not supported yet; the decisions, sizes and refusals are ported, the drawing isn't. The corpus has none of these.",
]

[[feature]]
key = "document"
name = "Crop, Canvas Size and Image Size"
# Image Size re-rasterizes layers through the transform module.
paths = ["port/crates/engine/src/document/**", "port/crates/engine/src/transform/**"]
gaps = [
    "The Mac app drops layer effects when it crops or resizes a document (`CanvasResizer.swift` and `ImageResizer.swift` don't copy `effects`). The port matches this, because parity means drawing what the Mac draws.",
    "Image Size redraws a rotated layer's mask as a white fill through the mask clipped to the layer's rectangle (`LayerRenderer.drawCoverage`). The port fades the clip's edges as it does an image's and covers the fill's edges by exact area; the edge pixels come out within 2 levels (44 of 6,400 mask pixels in `image-up-high`) and within 8 where the mask's own edge is sampled (6 of 400 in `image-down-smooth`). Two pixels the Mac covers alike by symmetry come out a level apart there, so the fill's coverage is not the exact area. Until it is exact, Image Size on a layer whose mask is redrawn at a rotation reports as not supported, so `image-up-high` and `image-down-smooth` are pending, although their flattened images match.",
]

[[feature]]
key = "export"
name = "JPEG and PNG export"
paths = ["port/crates/engine/src/export/**"]
gaps = [
    "PNG export matches the Mac exactly: pixels, and the sRGB, EXIF and pHYs metadata byte for byte.",
    "JPEG export uses ImageIO's own quantization tables at every 0.01 quality step, its chroma subsampling (4:2:0, 4:4:4 at quality 1) and BT.601 conversion, but Apple's encoder itself isn't available on Windows. Decoded pixels differ by up to 4-5 levels on photographic content and up to 32 on per-pixel noise at low quality (see the export overrides). The JFIF/EXIF/Photoshop header segments Apple writes aren't reproduced yet.",
]

[[feature]]
key = "selections"
name = "Selections: marquee, lasso, wand, color range"
# Select > Subject and Object Selection read their mask from `ml`.
paths = ["port/crates/engine/src/select/**", "port/crates/engine/src/ml/**"]
gaps = [
    "Select > Subject and Object Selection start from Apple's Vision, which the port stands in with U²-Netp; see the `ml` gap for what that costs. Everything after the model is the Swift's arithmetic. Smoothing the Mac's own traced mask (`object-aliased`) with the port's simplify-and-Chaikin lands within 1/255 of the Mac's `object` except 2 pixels, by up to 11, at one vertex; the two-disc cases show the same 2 pixels per outline, by up to 13. Where that comes from isn't known yet: the port's coverage there is the polygon's exact area, and toggling any single mask pixel nearby doesn't reproduce the Mac's.",
    "Expand and Contract on a curved outline (an ellipse, or anything with one in it) are refused, so those cases are pending. How Core Graphics strokes a curve isn't known yet: stroking the curve's flattened chords with round joins lands within 1/255 on a circle but 2/255 off on 2 pixels of a 48x40 ellipse expanded or contracted by 2 (`expand-ellipse`, `probe-contract-ellipse`) and 4/255 off on 32 pixels of an 8x6 ellipse expanded by 4 (`probe-expand-small-ellipse`). A single offset cubic per quarter fits the small ellipse but not the large one, so the stroker probably subdivides curves by some error measure.",
]

[[feature]]
key = "painting"
name = "Painting and retouching tools"
paths = ["port/crates/engine/src/paint/**", "port/crates/engine/src/adjust/gaussian.rs"]
gaps = [
    "Spot Healing's Create Texture mode seeds its grain with `UInt32.random` in `BrushStroke.heal()`, so neither the harness nor the port can reproduce it; the harness refuses it and the port reports it as not supported. Content-Aware and Proximity Match are exact.",
    "The tip's coverage comes from the Mac GPU's fast math. The port follows it (the nearest point on a segment is a fused multiply-add, the square root is x · rsqrt(x)), except where a hard tip's edge falls exactly half a level between two bytes and the GPU's own rsqrt decides: its √9 comes out just above 3, so a 6-pixel hard tip centered on a half-pixel line gives 127 where the port gives 128. Measured on the first heal-scratch probe, before its stroke moved off that line: 8 of 4,096 pixels, one level each.",
    "Painting a layer or mask that is rotated, flipped, scaled or off whole pixels, a solid placed mask, or a mask over 96 pixels wide (whose background the Mac reads from its thumbnail) reports as not supported.",
]

[[feature]]
key = "shapes"
name = "Gradient and shape"
paths = ["port/crates/engine/src/shape/**"]
gaps = [
    "A shape layer's alpha is exactly the coverage the Mac gives the same path as a selection (`probe-select-ellipse-*`: identical on all twelve ellipses), so shapes are filled with the selections' rasterizer (`select::raster`). That rasterizer is itself one level off the Mac on some edge pixels: 32 of 1,483 edge pixels in the rectangle and ellipse probes, 230 of about 3,000 on slanted line strokes (8 of them by 2 or 3). Rectangles, rounded rectangles and level, upright and 45° lines pass; ellipses and lines at other slants are pending, since one level off on a faint pixel moves its saved color by more than 1/255.",
    "Lines 1 px wide are pending: Core Graphics strokes them another way (a level line's ends reach half a pixel past its points; slanted ones fit neither butt, square nor round ends).",
    "Gradients: the table of 16 × (floor(ceil(length) / 16) + 1) − 2 colors, the 16 × 16 dither and its column order, and the precision of t (a linear gradient's unit direction and a radial one's position kept to 14 significant bits) are fitted to the references. Where t × slots lies within 7.4e-5 of a whole number the Mac can still pick the neighboring slot (2 pixels each in gradient-translucent and probe-ramp-diagonal, 3/255 and 4/255), so a linear gradient with any canvas pixel within 1e-4 of a slot boundary is pending (also gradient-opacity and gradient-reversed, which happen to match).",
    "Gradients inside a selection, on a mask that would grow past its layer (its background comes from its thumbnail) or that sits apart from its layer, and on layers that are scaled, turned or placed off whole pixels, are pending.",
]

[[feature]]
key = "type"
name = "Type"
paths = ["port/crates/engine/src/type/**"]
gaps = [
    "Layout matches the Mac exactly wherever the face is installed on both machines: every glyph position, line break and line height, and the layer's size, placement and text record. As TextKit does, runs are shaped with their ligatures, kerning applies only when tracking isn't 0, tracking follows every glyph, a line is `lineHeight` plus its fonts' line gap, and the baseline sits the rounded descent above the line's bottom.",
    "Core Text's rasterizer isn't available on Windows, so the port draws glyphs itself, following what the references show Core Graphics doing with font smoothing: glyph origins snap to ceil(36 / size) steps per pixel across and to whole pixels down; outlines are unhinted, curves halved until neither axis strays over 0.2 px, and edges grown by (0.0058 + 0.0025 × round(4 × luminance)) px per px of size, at most 0.3 px, with outward corners cut; coverage is exact area; overlapping glyphs keep the larger coverage. Stems match to 1/255 from 20 px up, in every color.",
    "Left over with the same outlines at 20 px and up: some curve joins, contour starts and overlapping contours, up to 54/255 on under 1% of a case's pixels (see the type overrides in tolerances.toml). Colored text also differs by up to 128 in the exported straight color of nearly transparent edge pixels, where alpha is 1 against 2.",
    "At 18 px and below, Core Graphics puts some glyphs' top edges on whole pixels for dark text. It isn't the font's TrueType hinting (running Arial's instructions matches some glyphs and not others), and the port doesn't reproduce it: up to 158/255 on the tops of letters.",
    "Helvetica and SF Pro aren't installed on Windows. There installed Arial stands in (Helvetica's widths, and closer to Helvetica's pixels than the open alternatives tried; the port ships no fonts), with the Apple face's vertical metrics, so lines and layer sizes still match but the letters are Arial's: up to 255/255 on 1-10% of pixels. On the Mac the port draws the installed faces, SF with its optical size and tracking, within 40/255.",
    "Point text and edited text layers that end up at a fractional position, rotated or scaled, draw as pending until transformed layers are ported; their layer pixels and project are still checked by #structure.",
]

[[feature]]
key = "import"
name = "Image import: JPEG, PNG, HEIC, TIFF, SVG and camera RAW"
paths = ["port/crates/image-import/**"]
gaps = [
    "PNG and TIFF (8 and 16-bit, gray, palette, alpha, orientation) match the Mac byte for byte, layer and render. Color-managed files (embedded Display P3 or Adobe RGB profile, gAMA with or without cHRM) are within 1/255: Core Image's conversion rounds some near-ties the other way. With alpha that can be 1 premultiplied level, which unpremultiplying at low alpha widens (png-p3-rgba: 56 of 4,096 pixels, see the override).",
    "JPEG: the entropy decoding, the orientations, and the conversions after the inverse DCT are matched (4:4:4 truncates, 4:2:0 goes through the HEIC conversion, 4:2:2 is first paired into 4:2:0 with a [1, 6, 1] / 8 filter across). Apple's inverse DCT is not: it differs from the exact, ISLOW, IFAST and float AAN transforms at 1-4% of samples by one level, which shows as up to 2/255 (4:2:0, 4:2:2) or 3/255 (4:4:4) after conversion, 4/255 with a P3 profile. Grayscale JPEG is within 1/255. Overrides list each case.",
    "CMYK JPEG is pending: ColorSync converts it with Apple's Generic CMYK profile, which the port doesn't have and can't ship. A naive CMYK to RGB conversion is off by 23 levels on average (135 at most) on import/jpeg-cmyk.",
    "HEIC 4:2:0, 8-bit, sRGB nclx: every pixel matches (bilinear chroma between sample centers, chroma divided by 254 where luma is divided by 255). With an alpha plane Apple repeats chroma samples and rounds to 8 bits before premultiplying; near-ties leave 1 premultiplied level on 22-35 pixels (overrides). HEIC 4:4:4 (HEVC range extensions) is pending: heic-rs doesn't decode it; libheif's output is within 1/255 of the Mac's.",
    "SVG made only of pixel-aligned solid rectangles matches byte for byte. Anything antialiased, stroked or filled with a gradient is pending: resvg isn't Core Graphics (import/svg-shapes: up to 78/255, and Core Graphics dithers gradients).",
    "Camera RAW is pending. The port develops uncompressed Bayer and LinearRaw DNGs from the DNG specification, but Apple's RAW engine can't be reproduced: on import/dng-linear-boost-0 the port is 4 levels off on average (55 at most), and Apple's Boost tone curve isn't a per-channel curve (dng-linear: 32 on average). The Mac refuses the corpus's synthetic Bayer DNGs with every optional tag combination tried, and a 96 x 64 LinearRaw DNG with levels counted per sample, while it develops the 192 x 128 LinearRaw file ignoring its single BlackLevel. A Bayer DNG with a preview in IFD 0 imports as the preview.",
]

[[feature]]
key = "ml"
name = "Select Subject and Remove Background"
paths = ["port/crates/engine/src/ml/**"]
gaps = [
    "Remove Background's subject mask comes from Apple's Vision (`VNGenerateForegroundInstanceMaskRequest`), which only runs on Apple's systems. The port stands in U²-Netp (Apache-2.0, 4.6 MB, run on the CPU through tract; `port/tools/fetch-models.sh` fetches it). Against Vision on `filters/remove-bg-basic` its mask has an IoU of 0.988 and a mean difference of 3.9/255 (Vision's edge is harder), which leaves 124 of 4,096 rendered pixels over 1/255, by up to 42. Advanced's refinement (the guided filter and matte contrast) is ported as the Swift does it and pulls both masks onto the same edges: on `filters/remove-bg-advanced` the IoU is 1.000, the mean difference 0.08/255, and the rendered pixels are within 3/255. Larger Apache/MIT models (IS-Net general-use, 176 MB; BiRefNet, about 220 MB) are the next step if real photographs show wider gaps.",
    "Select > Subject and Object Selection take the same stand-in. Vision numbers the objects it finds; U²-Netp gives one saliency map, so the port splits it into instances: each 8-connected region at 50% or more on the model's 320 x 320 grid, with the fainter pixels around it (down to 1/255) given to the region they reach first. A click picks the region under it on that grid, as the Mac picks Vision's instance, and the model finding nothing at all (a peak under 50% before rembg's stretch, as on a flat gray) means no subject, as Vision's empty result does. `CIEdgePreserveUpsampleFilter`, which lays the instance onto the image, isn't documented; the port does the joint bilateral upsampling it is named for with the Swift's sigmas. On the corpus the models agree on which object is where in every case but one. Traced without smoothing, the selections differ by 9 to 30 of 4,096 pixels (IoU 0.969 to 0.994: `object-aliased` and the Select > Subject cases). With smoothing on, the 9-pixel mask difference on the disc over the photo becomes 210 pixels (IoU 0.954), because the simplification keeps other vertices, and Edge carries it along (74 to 278 pixels); the right disc read over transparency comes out about a pixel off (97 pixels, IoU 0.908). On the two discs over a pale ground the masks match, and only the smoothing's 2-pixel residual is left. The one case the stand-in gets wrong is the photo read on its own (`object-ground-layer`): Vision finds no object and U²-Netp calls 39% of it subject, a region running into the frame. A salient-object model marks such regions where Vision may see nothing, so the port leaves an instance that touches the image's edge pending instead of guessing, for Object Selection and Select > Subject alike.",
]

[[feature]]
key = "ui"
name = "Panels, sheets, tool headers and menus"
paths = ["port/crates/app/**"]
gaps = [
    "UI states aren't compared pixel for pixel (`parity ui`, parity/README.md). Every state renders at the Mac's size, but text is Segoe UI rather than SF Pro and icons are Phosphor glyphs rather than SF Symbols (docs/port/icons.md), so no state is identical: over the 39 states both sides render, the mean SSIM on luminance is 0.89 and 4.0% of pixels are more than 32/255 apart on average (from 0.78 and 9.1% at the first comparison with the same sizes). Segoe UI is set 6.5 to 12% larger than the Mac's point size so labels run as wide as SF Pro's, and lines follow SF Pro's line heights and baselines; glyph shapes and weight still differ, and macOS draws text heavier at 1x.",
    "SwiftUI squeezes labels in crowded tool headers, and the port lays them out at their natural width. In Brush, Eraser and Spot Healing the Mac wraps the px after Size and the Color label onto two lines; in Magic the header is wider than the bar, so SwiftUI centers it and drops the Tolerance and Contiguous labels. The port centers an overflowing header too, so the controls after those labels sit a few points off (Magic's header SSIM 0.65, Brush's 0.82). An approximation of SwiftUI's HStack sizing (least flexible child first, each offered an even share of what is left) wrapped the right labels in Brush but also squeezed Spot Healing's title, which the Mac leaves whole, and lowered the scores, so it isn't used.",
    "SwiftUI mixes gradient colors in a perceptual space that isn't documented. The color picker's saturation/brightness field and hue strip mix in Oklab, the closest space found; the field comes within about 15/255 of the Mac's (1% of its pixels more than 32/255 apart).",
    "Camera Raw has no sheet in the port yet, so its UI state is pending. Grid Settings is compared through a copy of its layout in ui/sheets.rs, since the port has no grid yet.",
    "Menus match the Mac's once the documented mappings are applied (Ctrl written as ⌘; the Mac's app menu, the Window and Help menus' contents and the items macOS adds itself left out). Items whose feature the port lacks are disabled rather than hidden, so 5 items differ only in their enabled state: Cut, Copy and Paste, and Close Project and Select > All, which the Mac enables at launch because it opens an empty window.",
]
