# UI states rendered on both sides for comparison: the Mac by `ParityHarness ui`, Windows by the
# port's app in headless mode. Each state renders one view at its natural size, 1x scale, dark
# appearance, with preferences reset to defaults. See docs/port/ui-inventory.md for the views.
#
# Fields:
#   id        output name: <id>.png
#   view      which view: window, tool-rail, tool-header, status-bar, layers-panel, sheet
#   document  a corpus case whose input.comp is open (omit for no document)
#   tool      the selected tool (tool names as in ToolDefaults / the tool rail)
#   sheet     for view = "sheet": which sheet or floating panel
#   layer     for layer-specific sheets: index of the layer to select, bottom = 0

[[state]]
id = "window/welcome"
view = "window"

[[state]]
id = "window/document"
view = "window"
document = "blend/stack"
tool = "move"

[[state]]
id = "tool-rail"
view = "tool-rail"
tool = "move"

[[state]]
id = "status-bar/brush"
view = "status-bar"
document = "blend/stack"
tool = "brush"

[[state]]
