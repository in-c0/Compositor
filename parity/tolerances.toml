# Helvetica and the system font (SF Pro) aren't on Windows, where Arial stands in with their
# metrics. On the Mac the port draws the installed faces and stays within the first limit; on
# Windows up to `max_pixels_over` pixels, all on letter shapes, are further off.
[[override]]
cases = "type/face-helvetica-bold"
max_channel_diff = 17
max_pixels_over = 718
reason = "Mac: installed face, measured max 17/255. Windows: Arial stands in for an Apple face, measured max 208/255 with 718 of 15196 pixels (4.7%) over 17/255."
