# Per-feature tolerance overrides. The default is 1/255 per channel and can't be changed here.
#
# Each override needs a `reason` that explains the difference and where it is measured, and
# PARITY.md lists every override. Add one only for a gap we understand and can't close, such as a
# different font rasterizer. Never add one to make a failing case pass.
#
# [[override]]
# cases = "type/*"
# max_channel_diff = 3
# reason = "Glyph edges come from a different rasterizer than Core Text; measured in PARITY.md."

# Core Image runs Hard Mix, Color Burn, Color Dodge, Divide, Vivid Light and Soft Light on the
# Mac's GPU. Where the exact result is a tie (for Hard Mix, backdrop + source = 1 exactly), the
# answer depends on how Apple's GPU rounds a division, which no IEEE float order reproduces: in
# the references it goes both ways for mathematically identical sums. Everything else in these
# cases is held to 1/255. Measured on the hosted runner's Apple Paravirtual GPU; re-measure on
# the self-hosted Mac.
[[override]]
cases = "blend/hard-mix-alpha-100"
max_channel_diff = 1
max_pixels_over = 1
reason = "Hard Mix at an exact tie follows the Mac GPU's division rounding, which IEEE f32 can't reproduce: 1 of 4,096 pixels."

[[override]]
cases = "blend/hard-mix-alpha-60"
max_channel_diff = 1
max_pixels_over = 3
reason = "Hard Mix at an exact tie follows the Mac GPU's division rounding, which IEEE f32 can't reproduce: 3 of 4,096 pixels."

[[override]]
cases = "blend/color-burn-alpha-60"
max_channel_diff = 1
max_pixels_over = 1
reason = "One pixel where Core Image's GPU float arithmetic rounds a premultiplied Color Burn result the other way (off by 1 premultiplied, 2 after unpremultiplying): 1 of 4,096 pixels."

# JPEG export: Apple's JPEG encoder (ImageIO/AppleJPEG) isn't available outside macOS. The port
# encodes with the exact quantization tables and chroma subsampling ImageIO uses at each quality
# step (read off the export/jpeg-table-NNN probes), BT.601 color conversion and box-averaged
# chroma, as Apple's files show. What's left is Apple's own DCT and quantization rounding, which
# moves decoded pixels by a few levels on photographic content and more on pure noise at low
# quality. Limits are the measured maxima per case; the PNG export is exact.
[[override]]
cases = "export/jpeg-q100#jpeg"
max_channel_diff = 4
reason = "Different JPEG encoder than Apple's (same tables, 4:4:4): DCT rounding differs; measured max 4/255 on photo and noise content."

[[override]]
cases = "export/jpeg-q92-opaque#jpeg"
max_channel_diff = 5
reason = "Different JPEG encoder than Apple's (same tables and 4:2:0 chroma): DCT and quantization rounding differ; measured max 5/255 on photographic content."

[[override]]
cases = "export/jpeg-q0#jpeg"
max_channel_diff = 5
reason = "Different JPEG encoder than Apple's (same tables and 4:2:0 chroma): DCT and quantization rounding differ; measured max 5/255 on photographic content at quality 0."

[[override]]
cases = "export/jpeg-q85-white#jpeg"
max_channel_diff = 18
reason = "Different JPEG encoder than Apple's (same tables and 4:2:0 chroma): on per-pixel random noise, coefficients near quantization boundaries round the other way; measured max 18/255."

[[override]]
cases = "export/jpeg-q70-red#jpeg"
max_channel_diff = 18
reason = "Different JPEG encoder than Apple's (same tables and 4:2:0 chroma): on per-pixel random noise, coefficients near quantization boundaries round the other way; measured max 18/255."

[[override]]
cases = "export/jpeg-q50-black#jpeg"
max_channel_diff = 32
reason = "Different JPEG encoder than Apple's (same tables and 4:2:0 chroma): on per-pixel random noise at quality 0.5, coefficients near quantization boundaries round the other way; measured max 32/255."

[[override]]
cases = "export/jpeg-table-*#jpeg"
max_channel_diff = 27
reason = "Different JPEG encoder than Apple's (same tables, checked exactly by #jpeg-tables): DCT and quantization rounding differ on these 16x16 probes; measured max 27/255, at the lowest qualities."

[[override]]
cases = "psd/blend-hard-mix"
max_channel_diff = 1
max_pixels_over = 3
reason = "Hard Mix at exact ties follows the Mac GPU's division rounding (Core Image unpremultiplies with a reciprocal, so c/a lands on 0.99999994 for some alphas), which IEEE f32 can't reproduce: 3 of 4,096 pixels."

[[override]]
cases = "psd/fill-hard-mix"
max_channel_diff = 1
max_pixels_over = 1
reason = "Hard Mix at an exact tie follows the Mac GPU's division rounding, which IEEE f32 can't reproduce: 1 of 4,096 pixels."
# Remove Background's mask comes from Apple's Vision on the Mac and from U²-Netp in the port (see
# the `ml` gap in features.toml): no open model reproduces Vision's. Measured on Windows (RTX 2080,
# tract on the CPU); re-measure on the Mac runner.
[[override]]
cases = "filters/remove-bg-basic"
max_channel_diff = 42
structure_max_channel_diff = 157
reason = "Vision's subject mask can't be reproduced off Apple's systems; U²-Netp's edge is softer: 124 of 4,096 pixels over 1/255, by up to 42. The mask itself differs more than the flattened image shows: 240 of 2,304 mask pixels over 1/255, by up to 157."

[[override]]
cases = "filters/remove-bg-advanced"
max_channel_diff = 3
structure_max_channel_diff = 6
reason = "Vision's subject mask can't be reproduced off Apple's systems; after Advanced's guided refinement U²-Netp's mask lands within 3/255 (14 of 4,096 pixels over 1/255). The mask itself: 50 of 2,304 pixels over 1/255, by up to 6."

# Image import, JPEG: Apple's JPEG decoder (AppleJPEG) runs its own inverse DCT. Probed with
# coefficient-built files (import/jpeg-idct-basis, jpeg-idct-random), its output sits within
# about 0.15 of the exact transform but rounds differently from the exact, libjpeg ISLOW, IFAST
# and float AAN transforms at 1-4% of samples, so a luma or chroma sample is off by 1 there.
# Everything after the IDCT is matched (the 4:4:4 conversion truncates, subsampled chroma goes
# through the HEIC conversion); grayscale JPEG stays within 1/255. Color conversion multiplies a
# chroma step by up to 1.8, and the 4:4:4 path truncates, so a sample off by 1 shows as 2-3.
[[override]]
cases = "import/jpeg-orientation-*"
max_channel_diff = 3
reason = "Apple's JPEG inverse DCT rounds some samples the other way (probed, not reproducible); after the 4:4:4 conversion, measured max 3/255, 57 of 1,536 pixels over 1."

[[override]]
cases = "import/jpeg-*444"
max_channel_diff = 3
reason = "Apple's JPEG inverse DCT rounds some samples the other way (probed, not reproducible); after the 4:4:4 conversion, measured max 3/255 (jpeg-444, jpeg-noise-444, jpeg-ycc-444)."

[[override]]
cases = "import/jpeg-42[02]*"
max_channel_diff = 2
reason = "Apple's JPEG inverse DCT rounds some samples the other way (probed, not reproducible); the 4:2:0 and 4:2:2 conversions are matched; measured max 2/255."

[[override]]
cases = "import/jpeg-ycc-42[02]"
max_channel_diff = 2
reason = "Apple's JPEG inverse DCT rounds some samples the other way (probed, not reproducible); the 4:2:0 and 4:2:2 conversions are matched; measured max 2/255 on quality-100 noise."

[[override]]
cases = "import/jpeg-progressive"
max_channel_diff = 2
reason = "Apple's JPEG inverse DCT rounds some samples the other way (probed, not reproducible); same pixels as jpeg-420; measured max 2/255."

[[override]]
cases = "import/jpeg-p3"
max_channel_diff = 4
reason = "Apple's JPEG inverse DCT rounds some samples the other way (probed, not reproducible), and the Display P3 to sRGB conversion widens a 3-level difference to 4; measured max 4/255."

# Image import, color with alpha: the color conversion (ColorSync's, and HEIC's YCbCr) is matched
# to within a hair of Apple's, but where a premultiplied value lands within about 0.01 of a
# rounding tie it can round the other way. That is 1 premultiplied level; unpremultiplying at low
# alpha turns it into up to 51 straight levels. Allowed only for the measured pixel counts.
[[override]]
cases = "import/png-p3-rgba"
max_channel_diff = 1
max_pixels_over = 56
reason = "Display P3 to sRGB: ColorSync's arithmetic rounds near-ties differently (opaque P3 pixels stay within 1/255); at low alpha 1 premultiplied level unpremultiplies to up to 28 straight; 56 of 4,096 pixels."

[[override]]
cases = "import/heic-rgba"
max_channel_diff = 1
max_pixels_over = 35
reason = "HEIC with alpha: 1 premultiplied level at near-ties in the YCbCr conversion, up to 51 straight levels at alpha 1-10; 35 of 3,072 pixels."

[[override]]
cases = "import/heic-noise-rgba"
max_channel_diff = 1
max_pixels_over = 22
reason = "HEIC with alpha: 1 premultiplied level at near-ties in the YCbCr conversion, up to 8 straight levels at low alpha; 22 of 4,096 pixels."

# CIMotionBlur at angles other than 0 and 90 degrees rotates the image into the streak's frame
# and back on the Mac's GPU. How that GPU rounds the rotated texture coordinates isn't
# reproducible with IEEE float (many orderings tried), so a few pixels land a level or two off.
# Measured on the hosted runner's Apple Paravirtual GPU; everything else in these cases is exact.
[[override]]
cases = "adjust/motion-45-20"
max_channel_diff = 1
max_pixels_over = 6
reason = "Motion blur at 45 degrees: the Mac GPU's rounding of rotated texture coordinates isn't reproducible; 6 of 4,096 pixels are 2 levels off."

[[override]]
cases = "adjust/probe-motion-45-20"
max_channel_diff = 1
max_pixels_over = 6
reason = "Motion blur at 45 degrees: the Mac GPU's rounding of rotated texture coordinates isn't reproducible; 6 pixels are 2 levels off."

[[override]]
cases = "adjust/probe-motion-45-40"
max_channel_diff = 1
max_pixels_over = 43
reason = "Motion blur at 45 degrees, 40 px: the Mac GPU's rounding of rotated texture coordinates isn't reproducible; 43 of 16,384 pixels are up to 3 levels off."
