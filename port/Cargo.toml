[workspace]
resolver = "3"
members = ["crates/comp-format", "crates/engine", "crates/lab", "crates/parity", "crates/psd"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = { version = "30", features = ["static-dxc"] }
glob = "0.3"

comp-format = { path = "crates/comp-format" }
engine = { path = "crates/engine" }
psd = { path = "crates/psd" }

[profile.release]
debug = 1

# Pixel loops are unusable unoptimized; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 3
